apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-notebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-notebook
  template:
    metadata:
      labels:
        app: open-notebook
    spec:
      containers:
      - name: open-notebook
        image: ghcr.io/sparksis/open-notebook:0.1.0
        ports:
        - containerPort: 8502
        - containerPort: 5055
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - secretRef:
            name: open-notebook-secret

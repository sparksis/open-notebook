apiVersion: v1
kind: Service
metadata:
  name: open-notebook-lb
  labels:
    app: open-notebook
spec:
  type: LoadBalancer
  selector:
    app: open-notebook
  ports:
    - name: web
      protocol: TCP
      port: 8502
      targetPort: 8502
    - name: api
      protocol: TCP
      port: 5055
      targetPort: 5055
